<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作業票表紙｜SAKAE SEIKI-iS</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#e9edf3; color:#1a2233;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .screenBar{
    display:flex; align-items:center; gap:12px; padding:10px 18px; background:#173a68; color:#fff; font-size:13px;
  }
  .screenBar a{ color:#cfe0f5; text-decoration:none; font-size:12px; }
  .screenBar a:hover{ text-decoration:underline; }
  .screenBar button{
    margin-left:auto; border:none; background:#e67e22; color:#fff; font-weight:700; font-size:12.5px;
    padding:7px 16px; border-radius:6px; cursor:pointer; font-family:inherit;
  }
  .screenBar button:hover{ filter:brightness(1.08); }

  @page{ size: A5 landscape; margin: 5mm; }

  .sheetOuter{ display:flex; justify-content:center; padding:18px; }
  .sheet{
    background:#fff; width:210mm; height:148mm; box-shadow:0 4px 20px rgba(0,0,0,.15);
    display:flex; border:1.2px solid #222; position:relative;
  }
  .sideCol{
    flex:0 0 24mm; border-right:1.5px solid #222; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; padding-top:6mm;
  }
  .sideTitle{
    writing-mode:vertical-rl; text-orientation:upright; font-size:20px; font-weight:700; letter-spacing:2px;
  }
  /* 原本と同じく NO. は縦書きで大きめ・赤字（値は案件の社内No.を自動表示する） */
  .sideNoLabel{
    writing-mode:vertical-rl; text-orientation:upright; font-size:14px; font-weight:700; color:#1a2233; margin-top:12mm;
  }
  .sideNoVal{
    writing-mode:vertical-rl; text-orientation:upright; font-size:18px; font-weight:700; margin-top:3mm; letter-spacing:1px;
    color:#c0392b; flex:1 1 auto;
  }

  /* ---- 原本「作業票」の様式に合わせた構成（2026-08-19 現場要望）----
     上段：略図欄＋工程を手書きする12行の表（すべて空欄）
     下段：発行／型式／客先・受注日・納期・数量（自動入力するのはこの6項目だけ）
     それ以外の欄（社内No.・機械名／外注人名・NO./工程・着手・完成・実働H/見積H・備考）は
     原本どおり欄を残したうえで空欄にする（印刷後に手書きするため）。
     ただし左端の縦帯 NO. 欄だけは、2026-08-20 の現場要望により案件の社内No.を自動表示する
     （上記の「空欄にする」は縦帯 NO. については旧仕様。最新要望を優先する）---- */
  .mainCol{ flex:1 1 auto; display:flex; flex-direction:column; padding:3mm 3mm; min-width:0; }

  /* 上段：略図＋工程表（原本と同じ列幅・黒の実線） */
  .topRow{ display:flex; flex:1 1 auto; min-height:0; border:1px solid #222; border-bottom:none; }
  .sketchBox{ flex:0 0 42mm; border-right:1px solid #222; position:relative; }
  .sketchLabel{ position:absolute; top:1.2mm; left:1.2mm; font-size:8px; color:#98a2b3; }
  .procWrap{ flex:1 1 auto; display:flex; flex-direction:column; min-width:0; }
  table.procTable{ border-collapse:collapse; width:100%; height:100%; table-layout:fixed; font-size:9px; }
  /* 原本は1行の中央に点線が入る（上段＝手書き用／下段＝記入欄）。背景で細い点線を1本描く */
  table.procTable td{
    border:1px solid #222; height:6.2mm; padding:0 1mm;
    background-image:repeating-linear-gradient(to right,#9aa3b2 0 1.2px,transparent 1.2px 3px);
    background-size:100% 1px; background-position:0 50%; background-repeat:no-repeat;
  }
  table.procTable td.noDot{ background-image:none; }

  /* 見出し行：原本では「発行」と同じ段にあり、発行欄は略図の下（＝左端）に来る */
  table.headTable{ border-collapse:collapse; width:100%; table-layout:fixed; font-size:8.5px; }
  table.headTable th, table.headTable td{
    border:1px solid #222; padding:0.8mm 1mm; text-align:center; line-height:1.2;
  }
  table.headTable th{ font-weight:700; color:#1a2233; }
  table.headTable td.issueVal{ text-align:left; font-weight:700; font-size:10px; }

  /* 下段：情報帯 */
  table.infoTable{ border-collapse:collapse; width:100%; font-size:10px; table-layout:fixed; margin-top:0; }
  table.infoTable th, table.infoTable td{
    border:1px solid #222; padding:1.6mm 1.5mm; text-align:left; vertical-align:middle; line-height:1.3;
  }
  table.infoTable th{ background:#f2f4f8; font-weight:700; color:#3a4a63; white-space:nowrap; text-align:center; }
  table.infoTable td{ font-weight:600; }
  /* 客先は途中で改行させない。ラベル欄を13mmにしたので全角15字までは全部出る。
     それより長い場合は末尾が「…」で切れる（枠の高さを変えないことを優先した現状の挙動） */
  table.infoTable td.custCell{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  @media print{
    body{ background:#fff; }
    .screenBar{ display:none; }
    .sheetOuter{ padding:0; }
    .sheet{ box-shadow:none; border:1px solid #222; width:auto; height:auto; }
  }
  .emptyState{ color:#c0392b; font-size:13px; padding:30px; text-align:center; }
</style>
<script src="_sakaeSupabaseConfig.js"></script>
<script src="_sakaeSync.js"></script>
<script src="_workStartPrintCommon.js"></script>
</head>
<body>

  <div class="screenBar">
    <a href="#" id="backLink">← 作業開始印刷セットへ戻る</a>
    <span>作業票表紙（A5横）</span>
    <button type="button" onclick="window.print()">🖨 印刷</button>
  </div>

  <div class="sheetOuter" id="sheetOuter"></div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const productNo = (params.get('productNo') || '').trim();
  const P = window.sakaeWorkStartPrint;
  document.getElementById('backLink').setAttribute('href', '作業開始印刷セット_モック.html?productNo='+encodeURIComponent(productNo));

  const sheetOuter = document.getElementById('sheetOuter');
  if(!productNo){
    sheetOuter.innerHTML = '<div class="emptyState">品番が指定されていません。</div>';
    return;
  }

  // ---- 原本に合わせ、工程・着手・完成・実働H などは自動入力しない（印刷後に手書きするため）。
  // 自動入力するのは 発行日（印刷当日）／型式／客先／受注日／納期／数量 の6項目だけ。----
  const PROC_ROW_COUNT = 12;   // 原本・作業票印刷上段と同じ行数

  // 納期は原本の書式に合わせて月日のみで出す（例 9/18）
  function fmtMonthDay(dateStr){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr || '');
    if(!m) return '';
    return Number(m[2]) + '/' + Number(m[3]);
  }
  // 発行日は保存値ではなく印刷した当日を出す（原本の「発行」欄と同じ扱い）
  function todayJp(){
    const d = new Date();
    return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
  }
  // 工程を書く12行はすべて空欄。列は原本の見出しと同じ並びにしておく
  // 工程表の列幅（mm）。見出し行と1mmもずれないよう、ここの値を両方で使う
  const COLS = { machine:20, proc:16, start:10, end:10, hour:12, note:68 };
  const SKETCH_W = 42;   // 略図欄の幅
  // 「発行」「型式」「客先」のラベル欄の幅（mm）。見出し行と情報帯で同じ値を使い、
  // 原本どおり左端で縦に揃える（2026-08-19 現場要望：型式・客先のラベル欄が広すぎて値が右へ寄っていたため）
  const LABEL_W = 13;

  function procColGroup(){
    return '<colgroup>'
      + '<col style="width:'+COLS.machine+'mm;"><col style="width:'+COLS.proc+'mm;">'
      + '<col style="width:'+COLS.start+'mm;"><col style="width:'+COLS.end+'mm;">'
      + '<col style="width:'+COLS.hour+'mm;"><col>'
      + '</colgroup>';
  }
  // 工程を書く12行はすべて空欄。備考欄は点線を入れない（原本と同じ）
  function procRowsHtml(){
    let html = '';
    for(let i=0; i<PROC_ROW_COUNT; i++){
      html += '<tr><td></td><td></td><td></td><td></td><td></td><td class="noDot"></td></tr>';
    }
    return html;
  }

  function render(){
    const bs = P.loadBs(productNo);
    if(!bs || !bs.order){
      sheetOuter.innerHTML = '<div class="emptyState">品番「'+P.esc(productNo)+'」の作業票データが見つかりません。先に作業票を作成してください。</div>';
      return;
    }
    const o = bs.order || {};

    sheetOuter.innerHTML =
      '<div class="sheet">'
      // 左端の縦帯：原本どおり「作業票」と NO. 欄を置く。
      // NO. の値は案件の社内No.（bs.order.orderNo）を自動表示する（2026-08-20 現場要望・最新仕様）。
      // 部品のsubNoは使わない（表紙は案件単位で、部品を1件も参照しない）。
      // orderNoが空のときは空欄のままにする（productNoへのフォールバックはしない）。
      + '<div class="sideCol">'
      +   '<div class="sideTitle">作業票</div>'
      +   '<div class="sideNoLabel">NO．</div>'
      +   '<div class="sideNoVal">'+P.esc(o.orderNo||'')+'</div>'
      + '</div>'
      + '<div class="mainCol">'
      // 上段：略図欄（空欄）＋工程を手書きする12行（空欄）
      +   '<div class="topRow">'
      +     '<div class="sketchBox" style="flex:0 0 '+SKETCH_W+'mm;"><span class="sketchLabel">略図</span></div>'
      +     '<div class="procWrap"><table class="procTable">'+procColGroup()+'<tbody>'+procRowsHtml()+'</tbody></table></div>'
      +   '</div>'
      // 見出し行：原本と同じく左端が「発行」、その右に工程表の見出しが並ぶ
      +   '<table class="headTable">'
      +     '<colgroup>'
      +       '<col style="width:'+LABEL_W+'mm;"><col style="width:'+(SKETCH_W-LABEL_W)+'mm;">'
      +       '<col style="width:'+COLS.machine+'mm;"><col style="width:'+COLS.proc+'mm;">'
      +       '<col style="width:'+COLS.start+'mm;"><col style="width:'+COLS.end+'mm;">'
      +       '<col style="width:'+COLS.hour+'mm;"><col>'
      +     '</colgroup>'
      +     '<tr>'
      +       '<th>発　行</th><td class="issueVal">'+P.esc(todayJp())+'</td>'
      +       '<th>機械名<br>外注／人名</th><th>NO.<br>工程</th>'
      +       '<th>着手<br>日程</th><th>完成<br>日程</th>'
      +       '<th>実働H<br>見積H</th><th>備　考</th>'
      +     '</tr>'
      +   '</table>'
      // 下段：自動入力する6項目
      // ※ table-layout:fixed の表では列幅は colgroup（または1行目）だけで決まる。
      //    行の途中に width を書いても効かないため、必ずここで指定する。
      +   '<table class="infoTable">'
      +     '<colgroup>'
      +       '<col style="width:'+LABEL_W+'mm;"><col>'               // ラベル（発行欄と同じ幅）／ 型式・客先の値
      +       '<col style="width:18mm;"><col style="width:26mm;">'    // 受注日
      +       '<col style="width:14mm;"><col style="width:18mm;">'    // 納期
      +       '<col style="width:14mm;"><col style="width:20mm;">'    // 数量
      +     '</colgroup>'
      +     '<tr><th>型式</th><td colspan="7">'+P.esc(o.model||'')+'</td></tr>'
      +     '<tr>'
      +       '<th>客先</th><td class="custCell">'+P.esc(o.customer||'')+'</td>'
      +       '<th>受注日</th><td>'+P.esc(P.fmtDateJp(o.orderDate))+'</td>'
      +       '<th>納期</th><td>'+P.esc(fmtMonthDay(o.dueDate))+'</td>'
      +       '<th>数量</th><td>'+P.esc(o.qty||'')+'</td>'
      +     '</tr>'
      +   '</table>'
      + '</div>'
      + '</div>';
  }
  render();
  window.addEventListener('storage', (e)=>{
    if(e.key !== P.storageKeyFor(productNo)) return;
    render();
  });
})();
</script>
</body>
</html>
