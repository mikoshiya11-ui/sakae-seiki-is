<!DOCTYPE html>
<html lang="ja" data-sakae-auth-page="login">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン｜SAKAE SEIKI-OS</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:#f4f6fa; color:#1a2233;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    width:100%; max-width:360px; background:#fff; border-radius:14px; box-shadow:0 8px 28px rgba(20,35,70,.12);
    padding:32px 28px;
  }
  .brand{ display:flex; align-items:baseline; justify-content:center; gap:2px; font-size:19px; font-weight:700; margin-bottom:6px; }
  .brand .sakae{ color:#173a68; }
  .brand .is{ color:#c9752f; }
  .sub{ text-align:center; color:#8592a6; font-size:12.5px; margin-bottom:26px; }
  label{ display:block; font-size:12.5px; font-weight:700; color:#5b6b84; margin-bottom:5px; }
  .field{ margin-bottom:16px; }
  input[type="email"], input[type="password"]{
    width:100%; border:1.5px solid #dfe4ec; border-radius:8px; padding:10px 12px; font-size:14px;
    font-family:inherit; outline:none;
  }
  input[type="email"]:focus, input[type="password"]:focus{ border-color:#173a68; }
  button{
    width:100%; border:none; background:#173a68; color:#fff; font-size:14px; font-weight:700;
    padding:11px; border-radius:8px; cursor:pointer; font-family:inherit; margin-top:6px;
  }
  button:hover{ filter:brightness(1.1); }
  button:disabled{ opacity:.6; cursor:default; }
  .errMsg{
    background:#fdecea; color:#c0392b; border:1px solid #f6cfc9; border-radius:8px; padding:9px 12px;
    font-size:12.5px; margin-bottom:16px; display:none; line-height:1.5;
  }
  .errMsg.show{ display:block; }
  .noteBar{
    background:#fff7ec; border:1px solid #f3dcb8; color:#8a5a1a; font-size:11.5px; border-radius:8px;
    padding:9px 12px; margin-top:20px; line-height:1.6;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand"><span class="sakae">SAKAE</span><span class="is">&nbsp;SEIKI-OS</span></div>
    <div class="sub">社内システム・ログイン</div>

    <div class="errMsg" id="errMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">パスワード</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="loginBtn">ログイン</button>
    </form>

    <div class="noteBar">
      アカウントが無い場合は管理者（見越）に発行を依頼してください。自分でサインアップする画面はありません。
    </div>
  </div>

<script src="_sakaeSupabaseConfig.js"></script>
<script>
  const errEl = document.getElementById('errMsg');
  const formEl = document.getElementById('loginForm');
  const btnEl = document.getElementById('loginBtn');

  function showErr(msg){ errEl.textContent = msg; errEl.classList.add('show'); }

  if(!window.SAKAE_SUPABASE_URL || !window.SAKAE_SUPABASE_ANON_KEY || window.SAKAE_SUPABASE_URL.indexOf('YOUR-PROJECT-REF')!==-1){
    showErr('Supabaseの接続設定（_sakaeSupabaseConfig.js）がまだ設定されていません。管理者に確認してください。');
    btnEl.disabled = true;
  }

  // ログイン後の行き先。?next= は「同じサイトの、榮製機OS のフォルダの中のページ」だけ受け付ける。
  // よそのサイト（https://…・//…）や javascript: などは捨てて TOP へ戻す（外へ飛ばす・命令を動かす悪用を防ぐ）。
  // 正しい呼び出し元（_sakaeSync.js・_issueCountermeasures.js・_qaBox.js）は location.pathname + location.search を渡す。
  function nextUrl(){
    const DEFAULT_NEXT = '../SAKAE SEIKI-iS.html';
    const raw = new URLSearchParams(location.search).get('next');
    if(!raw) return DEFAULT_NEXT;
    try{
      const u = new URL(raw, location.href);
      if(u.protocol !== 'https:' && u.protocol !== 'http:') return DEFAULT_NEXT;
      if(u.origin !== location.origin) return DEFAULT_NEXT;
      const root = new URL('../', location.href).pathname;   // 榮製機OS のフォルダ（公開版では /sakae-seiki-is/）
      if(u.pathname.indexOf(root) !== 0) return DEFAULT_NEXT;
      // 「//」で始まると、返した文字がよそのサイトの住所として読まれる（サイトが住所の直下に置かれた時。イインチョー LOW-1）
      if(u.pathname.indexOf('//') === 0) return DEFAULT_NEXT;
      return u.pathname + u.search + u.hash;
    }catch(e){
      return DEFAULT_NEXT;
    }
  }

  const scriptEl = document.createElement('script');
  // ★SEC-M-4：版固定（@2 → @2.118.0）＋SRI。いまの @2 と同一バイト（SHA-384 一致確認済み）で挙動は不変。
  scriptEl.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js';
  scriptEl.integrity = 'sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK';
  scriptEl.crossOrigin = 'anonymous';
  scriptEl.onload = ()=>{
    if(btnEl.disabled) return; // 設定が無い場合はここで終わり
    const sb = window.supabase.createClient(window.SAKAE_SUPABASE_URL, window.SAKAE_SUPABASE_ANON_KEY);

    // 既にログイン済みならそのまま元のページへ
    sb.auth.getSession().then(({ data:{ session } })=>{
      if(session) location.href = nextUrl();
    });

    formEl.addEventListener('submit', async (e)=>{
      e.preventDefault();
      errEl.classList.remove('show');
      btnEl.disabled = true;
      btnEl.textContent = 'ログイン中…';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        showErr('ログインできませんでした（メールアドレスかパスワードが違います）。');
        btnEl.disabled = false;
        btnEl.textContent = 'ログイン';
        return;
      }
      location.href = nextUrl();
    });
  };
  scriptEl.onerror = ()=>{ showErr('通信エラーです。インターネット接続を確認してください。'); };
  document.head.appendChild(scriptEl);
</script>
</body>
</html>
