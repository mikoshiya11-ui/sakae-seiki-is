<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支給・納品一覧 印刷｜SAKAE SEIKI-iS</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#f4f6fa; color:#1a2233;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .topbar{
    background:#173a68; color:#fff; padding:12px 24px; display:flex; align-items:center; gap:10px;
    font-size:15px; font-weight:700;
  }
  .topbar .brand{ display:flex; align-items:baseline; gap:2px; }
  .topbar .brand .sakae{ color:#fff; }
  .topbar .brand .is{ color:#f0a35c; }
  .topbar .sep{ color:#5b7aab; }
  .topbar .pageName{ font-weight:400; color:#cfe0f5; }
  .topbar .backLink{ margin-right:auto; color:#cfe0f5; text-decoration:none; font-size:13.5px; font-weight:400; }

  .controlBar{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(20,35,70,.06);
    padding:12px 16px; margin:16px 20px;
  }
  .controlBar .rangeText{ font-size:13px; color:#2a3446; font-weight:700; }
  .controlBar .pageText{ font-size:12.5px; color:#5b6b84; }
  .printBtn{
    border:none; background:#173a68; color:#fff; font-size:13.5px; font-weight:700;
    padding:9px 18px; border-radius:8px; cursor:pointer; font-family:inherit; margin-left:auto;
  }
  .printBtn:hover{ background:#0f2a4e; }
  .warnBar{
    background:#fdecea; border:1px solid #f5c2bd; color:#a33226; font-size:12.5px; border-radius:10px;
    padding:10px 16px; margin:0 20px 16px; line-height:1.6;
  }
  .noteBar{
    background:#fff7ec; border:1px solid #f3dcb8; color:#8a5a1a; font-size:12.5px; border-radius:10px;
    padding:10px 16px; margin:0 20px 16px; line-height:1.6;
  }

  .sheetArea{ padding:0 20px 60px; }
  .weekSheet{
    background:#fff; border:1px solid #222; border-radius:0; margin:0 auto 20px;
    box-shadow:0 2px 10px rgba(20,35,70,.10); padding:8px 10px 10px;
    width:1512px;   /* A3横 - 余白8mm 相当（画面で仕上がりの幅を確かめるため） */
  }
  .sheetHead{ display:flex; align-items:baseline; gap:14px; border-bottom:1.5px solid #222; padding-bottom:5px; margin-bottom:6px; }
  .sheetTitle{ font-size:15px; font-weight:800; color:#1a2233; }
  .sheetWeek{ font-size:18px; font-weight:800; color:#173a68; }
  .sheetMeta{ margin-left:auto; font-size:10.5px; color:#5b6b84; }

  table.pboard{ border-collapse:collapse; table-layout:fixed; width:100%; }
  table.pboard th, table.pboard td{
    border:1px solid #9aa8b8; padding:2px 4px; font-size:10px; vertical-align:top;
    color:#1a2233; background:#fff; word-break:break-word;
  }
  table.pboard thead th{ background:#f0f3f8; font-weight:700; font-size:10px; text-align:center; }
  table.pboard thead th.fixedHead{ text-align:left; }
  table.pboard td.pFixed{ font-size:10px; white-space:normal; }
  table.pboard td.pOrderNo{ font-weight:800; color:#173a68; }
  table.pboard th.pDay.weekend, table.pboard td.pDay.weekend{ background:#f4f6fa; }
  table.pboard th.pDay.sun{ color:#c0392b; }
  table.pboard td.pDay{ padding:2px 3px; }
  tbody tr{ page-break-inside:avoid; break-inside:avoid; }

  /* 支給行は納品行の直下。行の区切りが紙でも分かるように、支給行の下を太くする */
  tr.pShikyu td{ background:#fcfdff; }
  tr.pShikyu td.pFixed:first-child{ border-left:2px solid #c0392b; }
  tr.pShikyuLast td{ border-bottom:1.5px solid #222; }
  .pLineTag{ font-weight:800; font-size:9.5px; }
  .pLineTag.nouhin{ color:#1a2233; }
  .pLineTag.shikyu{ color:#c0392b; }

  /* 自動で出る文字（納品行＝「型式 品名 納品」／支給行＝「型式 品名 支給」）。画面と同じく消せない固定表示 */
  .pAuto{
    display:block; font-weight:800; font-size:10px; line-height:1.3;
    padding-bottom:2px; margin-bottom:2px; border-bottom:1px dashed #9aa8b8; word-break:break-word;
  }
  .pAuto.nouhin{ color:#173a68; }
  .pAuto.shikyu{ color:#c0392b; }
  .pFree{ display:block; font-size:9.5px; line-height:1.3; white-space:pre-wrap; word-break:break-word; color:#2a3446; }

  .emptyState{ padding:60px 20px; text-align:center; color:#a4adbc; font-size:13px; line-height:1.8; }

  @media print{
    @page{ size:A3 landscape; margin:8mm; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body{ background:#fff; }
    .topbar, .controlBar, .noteBar, .warnBar{ display:none !important; }
    .sheetArea{ padding:0; }
    .weekSheet{
      width:auto; margin:0; border:none; border-radius:0; box-shadow:none; padding:0;
      page-break-after:auto; break-after:auto;
    }
    table.pboard thead{ display:table-header-group; }
    table.pboard thead th{ background:#f0f3f8 !important; }
  }
</style>
<script src="_sakaeSupabaseConfig.js"></script>
<script src="_sakaeSync.js"></script>
</head>
<body>

  <div class="topbar">
    <a class="backLink" id="backLink" href="支給納品一覧_モック.html">← 支給・納品一覧へ</a>
    <span class="brand"><span class="sakae">SAKAE SEIKI</span><span class="is">-iS</span></span>
    <span class="sep">｜</span>
    <span class="pageName">支給・納品一覧 印刷（1週間）</span>
  </div>

  <div class="controlBar">
    <span class="rangeText" id="rangeText">対象の週：—</span>
    <span class="pageText">1ページ＝1週間（A3横）</span>
    <button type="button" class="printBtn" id="doPrintBtn">🖨 印刷する</button>
  </div>

  <div class="warnBar" id="warnBar" style="display:none;"></div>

  <div class="noteBar">
    一覧の画面で見ていた<b>その1週間</b>をそのまま印刷します（週はURLで受け取っており、この画面で計算し直しません）。<br>
    案件ごとに<b>納品行</b>、支給がある案件はその直下に<b>支給行</b>が並びます。<b>型式 品名 納品</b>は納期の日、<b>型式 品名 支給</b>（赤）は支給日に出ます。表示専用です。
  </div>

  <div class="sheetArea" id="sheetArea"></div>
  <div class="emptyState" id="emptyState" style="display:none;"></div>

<script>
(function(){
  function esc(s){
    return (s==null?'':s).toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  // ---- 読み取り専用。この画面はデータを一切書き換えない ----
  const RECORDS_KEY = 'sakaeIS_records_v1';
  const BUHIN_PREFIX = 'sakaeIS_buhinhyoMock_v1_';
  const DETAIL_PREFIX = 'sakaeIS_shikyuNouhinBoard_v2_';
  const LINE_NOUHIN = 'nouhin';
  const LINE_SHIKYU = 'shikyu';

  function fmtKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parseDateStr(s){
    if(!s) return null;
    const p = String(s).split('-').map(Number);
    if(p.length!==3 || !p[0] || !p[1] || !p[2]) return null;
    const d = new Date(p[0], p[1]-1, p[2]);
    return isNaN(d) ? null : d;
  }
  function weekStartOf(d){
    const s = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    s.setDate(s.getDate() - ((s.getDay() + 6) % 7));   // 月曜へ寄せる
    return s;
  }

  function loadRecords(){
    try{ const raw = localStorage.getItem(RECORDS_KEY); if(raw) return JSON.parse(raw) || []; }catch(e){}
    return [];
  }
  function loadBuhinOrder(productNo){
    if(!productNo) return null;
    try{
      const raw = localStorage.getItem(BUHIN_PREFIX + productNo);
      if(raw){ const bs = JSON.parse(raw); return (bs && bs.order) ? bs.order : null; }
    }catch(e){}
    return null;
  }
  function productsFromRecords(){
    return loadRecords().map(r=>{
      const o = loadBuhinOrder(r.productNo) || {};
      return {
        productNo: r.productNo || '',
        orderNo: o.orderNo || r.orderNo || '',
        customer: o.customer || r.customer || '',
        model: o.model || r.modelName || '',
        itemName: o.itemName || r.itemName || '',
        dueDate: o.dueDate || r.dueDate || ''
      };
    }).filter(p=>p.productNo);
  }
  function loadDetail(productNo){
    try{
      const raw = localStorage.getItem(DETAIL_PREFIX + productNo);
      if(raw){
        const d = JSON.parse(raw) || {};
        const sh = (d.shikyu && typeof d.shikyu === 'object') ? d.shikyu : {};
        return {
          dayNotes: Array.isArray(d.dayNotes) ? d.dayNotes : [],
          shikyu: { enabled: !!sh.enabled, date: (typeof sh.date === 'string') ? sh.date : '' }
        };
      }
    }catch(e){}
    return { dayNotes: [], shikyu: { enabled:false, date:'' } };
  }
  function noteTextOf(d, dateStr, line){
    const n = (d.dayNotes||[]).find(z=> z && z.date === dateStr && z.line === line);
    return n ? (n.text || '') : '';
  }
  // 並び順は一覧の画面と同じ（納期の若い順）。紙と画面で並びが食い違わないようにする。
  function compareByDueDate(a, b){
    const da = a.p.dueDate||'', db = b.p.dueDate||'';
    if(da !== db){ if(!da) return 1; if(!db) return -1; return da < db ? -1 : 1; }
    const oa = a.p.orderNo || a.p.productNo || '', ob = b.p.orderNo || b.p.productNo || '';
    const c = oa.localeCompare(ob, 'ja', { numeric:true });
    if(c !== 0) return c;
    return (a.p.productNo||'').localeCompare(b.p.productNo||'', 'ja', { numeric:true });
  }

  const sheetArea = document.getElementById('sheetArea');
  const emptyState = document.getElementById('emptyState');
  const rangeText = document.getElementById('rangeText');
  const warnBar = document.getElementById('warnBar');
  const backLink = document.getElementById('backLink');

  // ---- 印刷する週は、一覧の画面から URL（?week=YYYY-MM-DD）で受け取る。
  // ここで「今日から1週間」を計算し直すと、画面で見ていた週と紙が食い違うため絶対にしない。 ----
  const params = new URLSearchParams(location.search);
  const weekParam = (params.get('week') || '').trim();
  const parsed = parseDateStr(weekParam);
  let weekStart = parsed ? weekStartOf(parsed) : null;

  function build(){
    if(!weekStart){
      sheetArea.innerHTML = '';
      emptyState.style.display = 'block';
      emptyState.innerHTML = 'どの週を印刷するかが指定されていません。<br>'
        + '<a href="支給納品一覧_モック.html">支給・納品一覧</a> の「🖨 印刷（この週）」から開いてください。';
      rangeText.textContent = '対象の週：—';
      return;
    }
    emptyState.style.display = 'none';

    const days = [];
    for(let i=0;i<7;i++){ const d = new Date(weekStart); d.setDate(d.getDate()+i); days.push(d); }
    const wEnd = days[6];
    const dow = ['日','月','火','水','木','金','土'];

    const label = weekStart.getFullYear()+'年 '+(weekStart.getMonth()+1)+'/'+weekStart.getDate()
      + ' 〜 '+(wEnd.getMonth()+1)+'/'+wEnd.getDate();
    rangeText.textContent = '対象の週：' + label;
    backLink.href = '支給納品一覧_モック.html';

    if(weekParam && parsed && fmtKey(weekStart) !== fmtKey(parsed)){
      // 週の途中の日付が渡ってきたときは、その週の月曜へそろえたことを隠さず出す
      warnBar.style.display = 'block';
      warnBar.textContent = '指定された日（'+weekParam+'）はその週の途中だったため、同じ週の月曜（'+fmtKey(weekStart)+'）から7日間で印刷します。';
    }

    const rows = productsFromRecords().map(p=> ({ p: p, d: loadDetail(p.productNo) })).sort(compareByDueDate);

    if(rows.length === 0){
      sheetArea.innerHTML = '';
      emptyState.style.display = 'block';
      emptyState.textContent = 'トップ画面に案件がありません。';
      return;
    }

    let head = '<colgroup>'
      + '<col style="width:110px;"><col style="width:80px;"><col style="width:90px;"><col style="width:52px;"><col style="width:130px;">'
      + days.map(()=>'<col>').join('')
      + '</colgroup>';

    let thead = '<thead><tr>'
      + '<th class="fixedHead">社内No.</th><th class="fixedHead">客先</th><th class="fixedHead">型式</th>'
      + '<th class="fixedHead">納期</th><th class="fixedHead">品名</th>'
      + days.map(d=>{
          const cls = 'pDay' + (d.getDay()===0||d.getDay()===6 ? ' weekend':'') + (d.getDay()===0?' sun':'');
          return '<th class="'+cls+'">'+(d.getMonth()+1)+'/'+d.getDate()+'<br>'+dow[d.getDay()]+'</th>';
        }).join('')
      + '</tr></thead>';

    function dayTd(d, autoText, autoCls, freeText){
      const cls = 'pDay' + (d.getDay()===0||d.getDay()===6 ? ' weekend':'');
      return '<td class="'+cls+'">'
        + (autoText ? '<span class="pAuto '+autoCls+'">'+esc(autoText)+'</span>' : '')
        + (freeText ? '<span class="pFree">'+esc(freeText)+'</span>' : '')
        + '</td>';
    }

    let body = '<tbody>';
    rows.forEach(r=>{
      const p = r.p, d = r.d;
      const due = parseDateStr(p.dueDate);
      const hasShikyu = !!(d.shikyu && d.shikyu.enabled);
      // 日付BOXに自動で出る文字。画面（支給納品一覧_モック.html の autoCellText）と同じ並びにそろえる。
      const autoCellText = (kind)=>{
        const bits = [];
        if(p.model) bits.push(p.model);
        if(p.itemName) bits.push(p.itemName);
        bits.push(kind);
        return bits.join(' ');
      };
      // ---- 納品行 ----
      body += '<tr class="pNouhin'+(hasShikyu?'':' pShikyuLast')+'">';
      body += '<td class="pFixed pOrderNo">'+esc(p.orderNo||'')+'<br><span class="pLineTag nouhin">納品</span></td>';
      body += '<td class="pFixed">'+esc(p.customer||'')+'</td>';
      body += '<td class="pFixed">'+esc(p.model||'')+'</td>';
      body += '<td class="pFixed">'+esc(p.dueDate ? p.dueDate.slice(5).replace('-','/') : '')+'</td>';
      body += '<td class="pFixed">'+esc(p.itemName||'')+'</td>';
      days.forEach(dd=>{
        const ds = fmtKey(dd);
        const auto = (due && ds === fmtKey(due)) ? autoCellText('納品') : '';
        body += dayTd(dd, auto, 'nouhin', noteTextOf(d, ds, LINE_NOUHIN));
      });
      body += '</tr>';
      // ---- 支給行（納品行の直下） ----
      if(hasShikyu){
        const sd = parseDateStr(d.shikyu.date);
        body += '<tr class="pShikyu pShikyuLast">';
        body += '<td class="pFixed"><span class="pLineTag shikyu">支給</span>'
          + (d.shikyu.date ? '<br>'+esc(d.shikyu.date.slice(5).replace('-','/')) : '') + '</td>';
        body += '<td class="pFixed">'+esc(p.customer||'')+'</td>'
          + '<td class="pFixed">'+esc(p.model||'')+'</td>'
          + '<td class="pFixed"></td>'
          + '<td class="pFixed">'+esc(p.itemName||'')+'</td>';
        days.forEach(dd=>{
          const ds = fmtKey(dd);
          const auto = (sd && ds === fmtKey(sd)) ? autoCellText('支給') : '';
          body += dayTd(dd, auto, 'shikyu', noteTextOf(d, ds, LINE_SHIKYU));
        });
        body += '</tr>';
      }
    });
    body += '</tbody>';

    const printedAt = new Date();
    const pad = n=>String(n).padStart(2,'0');
    sheetArea.innerHTML = '<div class="weekSheet">'
      + '<div class="sheetHead">'
      +   '<span class="sheetTitle">支給・納品一覧</span>'
      +   '<span class="sheetWeek">'+esc(label)+'</span>'
      +   '<span class="sheetMeta">出力：'+printedAt.getFullYear()+'/'+(printedAt.getMonth()+1)+'/'+printedAt.getDate()
      +     ' '+pad(printedAt.getHours())+':'+pad(printedAt.getMinutes())+'　案件 '+rows.length+'件</span>'
      + '</div>'
      + '<table class="pboard">'+head+thead+body+'</table>'
      + '</div>';
  }

  document.getElementById('doPrintBtn').addEventListener('click', ()=> window.print());

  window.addEventListener('storage', (e)=>{
    if(!e.key) return;
    if(e.key === RECORDS_KEY || e.key.indexOf(BUHIN_PREFIX)===0 || e.key.indexOf(DETAIL_PREFIX)===0) build();
  });

  build();
})();
</script>
</body>
</html>
